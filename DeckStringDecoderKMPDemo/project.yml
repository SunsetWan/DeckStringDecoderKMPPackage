name: DeckStringDecoderKMPDemo
options:
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "2650"
packages:
  DeckStringDecoderKMPPackage:
    url: https://github.com/SunsetWan/DeckStringDecoderKMPPackage.git
    exactVersion: 0.1.0-kmp.3
targets:
  DeckStringDecoderKMPDemo:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - DeckStringDecoderKMPDemo
    dependencies:
      - package: DeckStringDecoderKMPPackage
        product: DeckStringDecoder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 4MS63X2MZ8
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunset.learn.2026.DeckStringDecoderKMPDemo
        TARGETED_DEVICE_FAMILY: "1,2"
  DeckStringDecoderKMPDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - DeckStringDecoderKMPDemoTests
    dependencies:
      - target: DeckStringDecoderKMPDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DeckStringDecoderKMPDemo:
    build:
      targets:
        DeckStringDecoderKMPDemo: all
        DeckStringDecoderKMPDemoTests: [test]
    test:
      targets:
        - DeckStringDecoderKMPDemoTests
